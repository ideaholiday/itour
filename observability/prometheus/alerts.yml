groups:
  - name: idea-holiday-api
    interval: 30s
    rules:
      - alert: IdeaHolidayMetricsMissing
        expr: up{job="idea-holiday-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: idea-holiday-api
        annotations:
          summary: Idea Holiday API metrics are unavailable
          description: Prometheus has been unable to scrape the API for more than two minutes.

      - alert: IdeaHolidayHigh5xxRate
        expr: |
          (
            sum(rate(idea_holiday_http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(idea_holiday_http_requests_total[5m])), 0.001)
          ) > 0.02
          and sum(rate(idea_holiday_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          service: idea-holiday-api
        annotations:
          summary: API 5xx rate is above 2 percent
          description: The five-minute server-error ratio has remained above the service threshold.

      - alert: IdeaHolidaySlowApiP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(idea_holiday_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: idea-holiday-api
        annotations:
          summary: API p95 latency is above one second
          description: End-to-end API latency has exceeded the roadmap threshold for ten minutes.

      - alert: IdeaHolidaySlowDatabaseP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(idea_holiday_database_query_duration_seconds_bucket[5m]))
          ) > 0.25
        for: 10m
        labels:
          severity: warning
          service: idea-holiday-api
        annotations:
          summary: Database p95 query time is above 250 ms
          description: Database latency is high enough to investigate query plans and connection pressure.

      - alert: IdeaHolidayPaymentFailureRate
        expr: |
          (
            sum(rate(idea_holiday_payments_processed_total{outcome="FAILED"}[10m]))
            /
            clamp_min(sum(rate(idea_holiday_payments_processed_total[10m])), 0.001)
          ) > 0.10
          and sum(increase(idea_holiday_payments_processed_total[10m])) >= 5
        for: 5m
        labels:
          severity: critical
          service: idea-holiday-api
        annotations:
          summary: Payment failure rate is above 10 percent
          description: At least five payment attempts occurred and more than ten percent failed.

      - alert: IdeaHolidayPoorLcpP95
        expr: max(idea_holiday_frontend_web_vital{metric="LCP",quantile="0.95"}) > 2500
        for: 15m
        labels:
          severity: warning
          service: idea-holiday-web
        annotations:
          summary: Browser p95 LCP is above 2.5 seconds
          description: Measured largest-contentful-paint performance is outside the good user-experience threshold.

      - alert: IdeaHolidayPoorInpP95
        expr: max(idea_holiday_frontend_web_vital{metric="INP",quantile="0.95"}) > 500
        for: 15m
        labels:
          severity: warning
          service: idea-holiday-web
        annotations:
          summary: Browser p95 INP is above 500 ms
          description: Measured interaction latency is in the poor user-experience range.
