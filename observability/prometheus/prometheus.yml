global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: idea-holiday

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: idea-holiday-api
    metrics_path: /api/metrics
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets:
          - host.docker.internal:4000
        labels:
          deployment: local
